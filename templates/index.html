<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Detector de Daños Patrimoniales</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
                  url('https://upload.wikimedia.org/wikipedia/commons/3/3d/Iglesia_Mar%C3%ADa_Auxiliadora%2C_Huancayo.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
    }
    .container {
      background-color: rgba(0, 0, 0, 0.75);
      padding: 30px;
      border-radius: 20px;
      margin-top: 40px;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }
    .progress-bar {
      font-weight: bold;
    }
    .titulo {
      text-align: center;
      margin-bottom: 30px;
      font-size: 2.5rem;
    }
    .img-fluid {
      max-height: 300px;
      object-fit: cover;
      border: 3px solid #fff;
    }
    .form-label, h3, p {
      color: #ffdd57;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="titulo">🧠 Detector de Daños en Casonas Patrimoniales</h1>

    <form method="POST" enctype="multipart/form-data" class="mb-4">
      <div class="mb-3">
        <label class="form-label">📷 Sube una o más imágenes:</label>
        <input class="form-control" type="file" name="images" multiple required>
      </div>
      <button type="submit" class="btn btn-warning w-100">🔍 Analizar Daños</button>
    </form>

    {% if imagenes %}
      <h3 class="text-center mt-4">🖼 Resultados de Segmentación</h3>
      <div class="row mt-3">
        {% for img in imagenes %}
          <div class="col-md-4 mb-3">
            <img src="{{ url_for('static', filename='results/' ~ img) }}" class="img-fluid rounded shadow">
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <h3 class="text-center mt-4">📊 Análisis de Daños</h3>
    {% for clase, porcentaje in porcentajes.items() %}
      <p>{{ clase }}: {{ porcentaje }}%</p>
      <div class="progress mb-3">
        <div class="progress-bar bg-{{ 'danger' if porcentaje > 60 else 'warning' if porcentaje > 30 else 'success' }}" 
             style="width: {{ porcentaje }}%;">
          {{ porcentaje }}%
        </div>
      </div>
    {% endfor %}
  </div>
</body>
</html>
